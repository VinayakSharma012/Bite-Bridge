services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitebridge-backend
    ports:
      - "8080:8080"
    environment:
  SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://localhost:27017/bitebridge}
      SPRING_DATA_MONGODB_DATABASE: bitebridge
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret_jwt_key_please}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-your_email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-your_app_password}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: bitebridge-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

