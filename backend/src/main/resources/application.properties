# Server Configuration
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://sparkynft01_db_user:cZSchqEwFrJ1dcIl@cluster0.xdximcw.mongodb.net/?appName=Cluster0}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:bitebridge}

# JWT Configuration
