# Server Configuration
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bitebridge}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:bitebridge}
app.mongodb.server-selection-timeout-ms=${APP_MONGODB_SERVER_SELECTION_TIMEOUT_MS:10000}
app.mongodb.connect-timeout-ms=${APP_MONGODB_CONNECT_TIMEOUT_MS:10000}
app.mongodb.read-timeout-ms=${APP_MONGODB_READ_TIMEOUT_MS:20000}
app.mongodb.max-connection-pool-size=${APP_MONGODB_MAX_CONNECTION_POOL_SIZE:50}
app.mongodb.min-connection-pool-size=${APP_MONGODB_MIN_CONNECTION_POOL_SIZE:5}
app.mongodb.max-connection-idle-time-ms=${APP_MONGODB_MAX_CONNECTION_IDLE_TIME_MS:60000}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_512_bit_secret_key_here_change_in_production_this_is_a_very_long_secret_key_for_hs512_algorithm_signing_that_is_secure_enough_1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Mail Configuration (Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.bitebridge=INFO
logging.level.org.springframework.security=INFO
logging.level.org.mongodb.driver=WARN

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Application
spring.application.name=bitebridge

# Actuator health probes (use /actuator/health/liveness for platform health checks)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mongo.enabled=false

# Sample data (opt-in; enable only when explicitly needed)
app.seed.enabled=${APP_SEED_ENABLED:false}
