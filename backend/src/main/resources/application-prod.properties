# Production Configuration
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:bitebridge}
app.mongodb.server-selection-timeout-ms=${APP_MONGODB_SERVER_SELECTION_TIMEOUT_MS:10000}
app.mongodb.connect-timeout-ms=${APP_MONGODB_CONNECT_TIMEOUT_MS:10000}
app.mongodb.read-timeout-ms=${APP_MONGODB_READ_TIMEOUT_MS:20000}
app.mongodb.max-connection-pool-size=${APP_MONGODB_MAX_CONNECTION_POOL_SIZE:50}
app.mongodb.min-connection-pool-size=${APP_MONGODB_MIN_CONNECTION_POOL_SIZE:5}
app.mongodb.max-connection-idle-time-ms=${APP_MONGODB_MAX_CONNECTION_IDLE_TIME_MS:60000}

# JWT
jwt.secret=${JWT_SECRET:change_me_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.bitebridge.com}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Logging
logging.level.com.bitebridge=INFO
logging.level.org.springframework.security=WARN

# Actuator health probes (recommended Render health check: /actuator/health/liveness)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Security
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}

# Sample data
app.seed.enabled=${APP_SEED_ENABLED:false}
